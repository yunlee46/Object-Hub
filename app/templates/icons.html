{# Inline SVG icon set. Inlined rather than sprited so a cold page needs no extra
   request, and so icons inherit currentColor everywhere. #}

{% macro icon(name, size=None) -%}
{%- set attrs = 'width="' ~ size ~ '" height="' ~ size ~ '"' if size else '' -%}
<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" {{ attrs|safe }}>
{%- if name == 'cube' -%}
  <path d="M12 2.5 21 7v10l-9 4.5L3 17V7z"/><path d="M3 7l9 4.5L21 7"/><path d="M12 11.5V21.5"/>
{%- elif name == 'box' -%}
  <path d="M3.5 8h17v11.5a1.5 1.5 0 0 1-1.5 1.5H5a1.5 1.5 0 0 1-1.5-1.5z"/>
  <path d="M2.5 4.5h19V8h-19z"/><path d="M10 12h4"/>
{%- elif name == 'grid' -%}
  <rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/>
  <rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/>
{%- elif name == 'pin' -%}
  <path d="M12 21.5s7-6.1 7-11.1a7 7 0 1 0-14 0c0 5 7 11.1 7 11.1z"/><circle cx="12" cy="10" r="2.6"/>
{%- elif name == 'tag' -%}
  <path d="M20.6 12.9 12.9 20.6a2 2 0 0 1-2.8 0L3.4 13.9a2 2 0 0 1-.6-1.6l.5-7.1a1.5 1.5 0 0 1 1.4-1.4l7.1-.5a2 2 0 0 1 1.6.6l6.7 6.7a2 2 0 0 1 .5 2.3z"/>
  <circle cx="8.2" cy="8.2" r="1.4"/>
{%- elif name == 'qr' -%}
  <rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/>
  <rect x="3" y="14" width="7" height="7" rx="1.5"/><path d="M14 14h3v3h-3z"/><path d="M20.5 14v.01"/>
  <path d="M17.5 20.5h3.5"/><path d="M14 20.5v.01"/>
{%- elif name == 'scan' -%}
  <path d="M4 8V6a2 2 0 0 1 2-2h2"/><path d="M16 4h2a2 2 0 0 1 2 2v2"/>
  <path d="M20 16v2a2 2 0 0 1-2 2h-2"/><path d="M8 20H6a2 2 0 0 1-2-2v-2"/><path d="M4 12h16"/>
{%- elif name == 'search' -%}
  <circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/>
{%- elif name == 'plus' -%}
  <path d="M12 5v14"/><path d="M5 12h14"/>
{%- elif name == 'pencil' -%}
  <path d="M4 20h4L20 8a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M14.5 5.5 18.5 9.5"/>
{%- elif name == 'move' -%}
  <path d="M12 3v18"/><path d="M3 12h18"/><path d="M9 6l3-3 3 3"/><path d="M9 18l3 3 3-3"/>
  <path d="M6 9 3 12l3 3"/><path d="M18 9l3 3-3 3"/>
{%- elif name == 'archive' -%}
  <rect x="3" y="4" width="18" height="4" rx="1"/><path d="M5 8v11a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V8"/>
  <path d="M10 12h4"/>
{%- elif name == 'restore' -%}
  <path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3 4v5h5"/>
{%- elif name == 'trash' -%}
  <path d="M4 7h16"/><path d="M10 4h4a1 1 0 0 1 1 1v2H9V5a1 1 0 0 1 1-1z"/>
  <path d="M6 7v12.5A1.5 1.5 0 0 0 7.5 21h9a1.5 1.5 0 0 0 1.5-1.5V7"/><path d="M10 11v6"/><path d="M14 11v6"/>
{%- elif name == 'image' -%}
  <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/>
  <path d="M21 16l-5-5-6 6-3-3-4 4"/>
{%- elif name == 'print' -%}
  <path d="M7 8V3.5h10V8"/><rect x="3" y="8" width="18" height="8" rx="1.5"/>
  <path d="M7 14h10v6.5H7z"/>
{%- elif name == 'check' -%}
  <path d="M4.5 12.5 9.5 17.5 20 7"/>
{%- elif name == 'info' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 11v5.5"/><path d="M12 7.8v.01"/>
{%- elif name == 'warning' -%}
  <path d="M10.3 3.9a2 2 0 0 1 3.4 0l7.4 13a2 2 0 0 1-1.7 3H4.6a2 2 0 0 1-1.7-3z"/>
  <path d="M12 9v4.5"/><path d="M12 17.2v.01"/>
{%- elif name == 'alert' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7.5V13"/><path d="M12 16.4v.01"/>
{%- elif name == 'sun' -%}
  <circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2"/><path d="M12 19.5v2"/><path d="M2.5 12h2"/>
  <path d="M19.5 12h2"/><path d="M5.3 5.3l1.4 1.4"/><path d="M17.3 17.3l1.4 1.4"/>
  <path d="M18.7 5.3l-1.4 1.4"/><path d="M6.7 17.3l-1.4 1.4"/>
{%- elif name == 'moon' -%}
  <path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z"/>
{%- elif name == 'chevron-right' -%}
  <path d="M9 5l7 7-7 7"/>
{%- elif name == 'layers' -%}
  <path d="M12 3 3 7.5l9 4.5 9-4.5z"/><path d="M3 12.5 12 17l9-4.5"/><path d="M3 17 12 21.5 21 17"/>
{%- elif name == 'clock' -%}
  <circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3.2 2"/>
{%- elif name == 'star' -%}
  <path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.9-5.2-2.8-5.2 2.8 1-5.9L3.5 9.7l5.9-.8z"/>
{%- endif -%}
</svg>
{%- endmacro %}
