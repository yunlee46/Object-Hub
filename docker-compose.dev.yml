# Development overlay: hot reload and a published database port.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# The source tree is bind-mounted, so edits reload immediately. Never use this file on
# a NAS: it exposes PostgreSQL and runs the reloader.

services:
  db:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  app:
    volumes:
      - ./app:/app/app
      - ./alembic:/app/alembic
      - photo-data:/data
    environment:
      APP_NAME: Object Hub (dev)
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
      - --reload-dir
      - /app/app
